name: Build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Build
        run: |
          swiftc --version
          scripts/build.sh --zip

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: MissionCloser
          path: build/MissionCloser.zip

      # 推送 v* 标签时：创建（或更新）对应的 Release 并上传 zip
      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" build/MissionCloser.zip --clobber
          else
            gh release create "$GITHUB_REF_NAME" build/MissionCloser.zip \
              --title "MissionCloser ${GITHUB_REF_NAME#v}" --generate-notes
          fi
